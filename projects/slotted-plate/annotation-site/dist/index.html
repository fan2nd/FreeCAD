<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>推力计与笔 · 尺寸标注台</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="brand"><span class="logo">↔</span><div><b>尺寸标注台</b><small>推力计与笔 / 凹槽底板</small></div></div><div class="actions"><span id="saved" role="status">仅保存在此浏览器</span><button id="copy">复制给 Codex</button><button id="export">导出 JSON</button><button id="png" class="primary">导出标注图 ↗</button></div></header>
<main><section class="workspace"><div class="toolbar"><div class="tabs"><button id="diagram" class="active">尺寸示意图</button><button id="original">原始草图</button></div><div><button id="noteMode">＋ 添加图上备注</button><button id="minus" aria-label="缩小">−</button><button id="fit">100%</button><button id="plus" aria-label="放大">＋</button></div></div><div class="tip"><span class="dot"></span><span id="hint">点击蓝色尺寸编号填写数值；也可以在任意位置添加备注。</span><span class="unit">长度 mm / 角度 deg</span></div><div id="viewport"><div id="stage"><div id="drawing"></div><div id="pins"></div></div></div><div class="foot"><span>图形不按比例 · 绿色为已填写，未确认尺寸仅作占位</span><label class="import">导入记录<input id="import" type="file" accept="application/json,.json" hidden></label></div></section>
<aside><div class="aside-head"><span class="eyebrow">MEASUREMENT LOG</span><h2>把尺寸落在图上</h2><div class="progress"><i id="bar"></i></div><div id="count">0 / 31 项已填写</div></div><section id="editor"><div class="editor-title"><span id="badge">A1</span><h3 id="name">推力计宽</h3></div><p id="nominal"></p><label for="value">实测尺寸 <em>mm</em></label><input id="value" type="number" min="0" step="any" placeholder="输入实测值"><p id="error" role="alert"></p><label for="comment">补充说明</label><textarea id="comment" rows="2" placeholder="例如：孔为 M4 螺纹，深 6 mm"></textarea><div class="editor-actions"><button id="clear">清除此项</button><button id="next" class="primary">下一待填项 →</button></div></section><section id="noteEditor" hidden><div class="editor-title"><span id="noteBadge">注 1</span><h3>图上备注</h3></div><label for="noteText">描述这个位置</label><textarea id="noteText" rows="4" placeholder="填写尺寸、修改意见或说明"></textarea><p class="muted">点击其他位置可继续标注。备注会保留在对应视图。</p><button id="deleteNote">删除这条备注</button></section><div class="list-tools"><input id="search" placeholder="搜索编号或尺寸名称" aria-label="搜索尺寸"><select id="filter" aria-label="筛选尺寸"><option value="all">全部尺寸</option><option value="pending">待填写</option><option value="A">推力计</option><option value="B">笔</option><option value="C">底板 / 槽</option><option value="H">安装孔</option></select></div><div id="list"></div><div class="note-list"><h3>图上备注 <span id="noteCount">0</span></h3><div id="notes"></div></div><p class="privacy">自动保存在当前浏览器，不会自动回传到聊天。完成后复制文字或导出 JSON 发给我即可。</p></aside></main><div id="toast" role="status"></div><dialog id="copyDialog"><h3>复制以下内容发回聊天</h3><textarea id="copyText" rows="14" readonly></textarea><button id="closeDialog">关闭</button></dialog><script src="app.js"></script></body></html>
